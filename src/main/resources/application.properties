server.port=${PORT:8080}

# Local default: file database. In production set DB_URL / DB_USER / DB_PASS (PostgreSQL).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/lostfound}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Comma-separated list of frontend origins allowed to call this API
app.cors-origin=${CORS_ORIGIN:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# MUST be overridden in production (at least 32 characters)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.ttl-hours=72
